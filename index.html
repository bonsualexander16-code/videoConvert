<body>

   <header>
           <div class="logo">
               <img src="video-camera.png" alt="logo"/>
               <h1>     To     </h1>
               <img src="headphone.png" alt="logo"/>
           </div>
   </header>
   
   <div>
       <p id="p">
Convert Video files into audio formats and add image as audio covers. 
Video file size must be less than 15MB for better performance.
       </p>
   </div>
   
   <form id="uploadForm" action="https://vidcon-i9ks.onrender.com/convert" enctype="multipart/form-data"
   method="post"autocomplete="on">
       <div>
         <label>Input video file</label><br>
         <input type="file" id="vidFile" name="video" accept="video/*" hidden required/>
         <video src="" id="vid" hidden></video>
         <button type="button" onclick="vidFile.click()" style="padding:10px ;">Add Video File</button>
       </div>
       <div>
           <label>Input image file</label><br>
           <input type="file" id="imgFile" hidden  name="picture" accept="image/*" required/>
           <img id="img" hidden/>
           <button type="button" onclick="imgFile.click()" style="padding:10px">Add Image File</button>
       </div>
       <div>
           <label>Name for new file</label><br>
           <input type="text" name="filename" placeholder="enter name for your new file" required/>
       </div>
      <input type="submit" value="convert"/>
   </form>
   
   <p id="status">updates shows here</p>
   <script>
        const imgFile = document.getElementById("imgFile");
  const img = document.getElementById("img");

  const vidFile = document.getElementById("vidFile");
  const vid = document.getElementById("vid");

  // VOMIT 1: LISTENERS DEY OUTSIDE — E GO RUN ONCE ONLY
  imgFile.addEventListener("change", () => {
      const file = imgFile.files[0];
      if (file) {
          console.log('Image selected:', file.name);
          const url = URL.createObjectURL(file);
          img.src = url;
          img.hidden = false;
          img.onload = () => URL.revokeObjectURL(url); // Free memory
      }
  });

  vidFile.addEventListener("change", () => {
      const file = vidFile.files[0];
      if (file) {
          console.log('Video selected:', file.name);
          const url = URL.createObjectURL(file);
          vid.src = url;
          vid.hidden = false;
          vid.onloadeddata = () => URL.revokeObjectURL(url); // Free memory
      }
  });
   </script>

    <script src="index.js" defer></script>
</body>
